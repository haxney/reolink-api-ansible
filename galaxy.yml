namespace: haxney
name: reolink
version: 0.4.1
readme: README.md
description: Ansible collection for managing Reolink IP cameras and NVRs
authors:
  - Dan Hackney <dan@haxney.org>
license:
  - GPL-3.0-or-later
tags:
  - networking
  - security
  - camera
  - reolink
  - iot
repository: https://github.com/haxney/reolink-api-ansible
homepage: https://github.com/haxney/reolink-api-ansible
issues: https://github.com/haxney/reolink-api-ansible/issues
dependencies: {}

# Local state that is not part of the collection. Before 0.3.1, builds
# shipped the developer's .claude settings and the pytest cache.
build_ignore:
  - .claude
  - .pytest_cache
  - .venv
  - .gitignore
  - "*.tar.gz"
